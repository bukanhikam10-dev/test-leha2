<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Web Simulator - Vercel Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .glass-dark { background: rgba(20, 20, 20, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen m-0 overflow-hidden">

    <div class="relative w-[390px] h-[844px] bg-black rounded-[50px] shadow-2xl border-[12px] border-slate-900 overflow-hidden flex flex-col justify-between select-none">
        
        <!-- Dynamic Island -->
        <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-28 h-7 bg-black rounded-full z-50 flex items-center justify-between px-2.5 pointer-events-none">
            <div class="w-3 h-3 bg-slate-900 rounded-full"></div>
            <div class="w-2.5 h-2.5 bg-blue-600 rounded-full animate-pulse"></div>
        </div>

        <!-- Status Bar -->
        <div class="absolute top-0 left-0 right-0 h-12 px-6 flex justify-between items-center text-white text-xs font-medium z-40 pt-1 pointer-events-none">
            <span>23:46</span>
            <div class="flex items-center space-x-1.5">
                <span>5G</span>
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19H8v2h8v-2h3.65l-1.62-1.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
            </div>
        </div>

        <!-- Phone Container Screen -->
        <div id="phone-screen" class="relative w-full h-full flex flex-col justify-between pt-12 pb-6 px-3 bg-cover bg-center transition-all duration-300" style="background-image: url('https://images.unsplash.com/photo-1533738363-b7f9aef128ce?q=80&w=1000&auto=format&fit=crop');">
            
            <!-- 1. LOCK SCREEN (Layer Paling Atas saat awal) -->
            <div id="lock-screen" class="absolute inset-0 pt-14 pb-6 px-3 flex flex-col justify-between bg-cover bg-center z-40" style="background-image: url('https://images.unsplash.com/photo-1533738363-b7f9aef128ce?q=80&w=1000&auto=format&fit=crop');">
                <div class="flex flex-col items-center text-white mt-4">
                    <span class="text-sm font-medium tracking-wide drop-shadow-md">Rabu, 21 Oktober</span>
                    <h1 class="text-7xl font-light tracking-tighter drop-shadow-lg">23:46</h1>
                </div>

                <div class="space-y-2 mb-2">
                    <div onclick="unlockPhone()" class="glass-dark p-3 rounded-2xl text-white cursor-pointer hover:bg-black/70 transition border border-white/10 shadow-lg">
                        <div class="flex items-center justify-between text-[11px] text-gray-300 mb-1">
                            <div class="flex items-center space-x-1.5">
                                <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
                                <span class="font-semibold text-white">WhatsApp</span>
                            </div>
                            <span>23.41</span>
                        </div>
                        <p class="text-xs font-medium">Ilham: "kalo lo sayang orang tapi ngerasa ga dibalik..."</p>
                    </div>

                    <div onclick="unlockPhone()" class="glass-dark p-3 rounded-2xl text-white cursor-pointer hover:bg-black/70 transition border border-white/10 shadow-lg">
                        <div class="flex items-center justify-between text-[11px] text-gray-300 mb-1">
                            <div class="flex items-center space-x-1.5">
                                <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                                <span class="font-semibold text-white">Gemini AI</span>
                            </div>
                            <span>sekarang</span>
                        </div>
                        <p class="text-xs font-medium">✨ "Siap membantu merangkum ide dan coding kamu."</p>
                    </div>
                </div>

                <div class="flex justify-between items-center px-4 pb-2">
                    <button class="w-10 h-10 rounded-full glass flex items-center justify-center text-white shadow">🔦</button>
                    <button onclick="unlockPhone()" class="text-xs text-white bg-white/25 px-5 py-2.5 rounded-full backdrop-blur font-medium hover:bg-white/40 transition shadow cursor-pointer">Ketuk untuk Membuka</button>
                    <button class="w-10 h-10 rounded-full glass flex items-center justify-center text-white shadow">📷</button>
                </div>
            </div>

            <!-- 2. HOME SCREEN (Tampil setelah lock screen ditutup) -->
            <div id="home-screen" class="flex flex-col h-full justify-between z-20 pt-2">
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <div class="glass p-3 rounded-3xl text-white flex flex-col justify-between h-28 shadow-md">
                        <div class="flex justify-between text-xs font-medium"><span>Kalender</span><span>21 Okt</span></div>
                        <div><div class="text-2xl font-bold">21</div><div class="text-[11px] opacity-80">Rabu • 3 Agenda</div></div>
                    </div>
                    <div class="glass p-3 rounded-3xl text-white flex flex-col justify-between h-28 shadow-md bg-blue-900/30">
                        <div class="text-xs font-medium">Cuaca</div>
                        <div><div class="text-xl font-bold">Berawan</div><div class="text-[11px] opacity-80">Jakarta 28°C</div></div>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-y-4 gap-x-2 px-1">
